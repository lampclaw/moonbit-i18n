name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOONBIT_TOOLCHAIN: 0.10.6+80dc50f24
  MOONBIT_INSTALLER_SHA256: 46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe
  MOONBIT_WINDOWS_INSTALLER_SHA256: a5101e91ffa9905fb25cd009b9a4aa942971a294bd055c89836e3af89b710c64
  MOON_VERSION: 0.1.20260803
  MOONC_VERSION: 0.10.6
  NODE_VERSION: 26.7.0

jobs:
  quality:
    name: Engineering readiness · Node 26
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup MoonBit
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moonbit-install.sh
          printf '%s  %s\n' "$MOONBIT_INSTALLER_SHA256" /tmp/moonbit-install.sh | sha256sum -c -
          bash /tmp/moonbit-install.sh "$MOONBIT_TOOLCHAIN"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify pinned toolchain and dependencies
        run: |
          version_output="$(moon version --all)"
          printf '%s\n' "$version_output"
          installed_moon="$(printf '%s\n' "$version_output" | awk '$1 == "moon" { print $2; exit }')"
          installed_moonc="$(printf '%s\n' "$version_output" | awk '$1 == "moonc" { sub(/^v/, "", $2); split($2, parts, "+"); print parts[1]; exit }')"
          installed_node="$(node -p 'process.versions.node')"
          test "$installed_moon" = "$MOON_VERSION" || {
            echo "expected moon $MOON_VERSION, got $installed_moon" >&2
            exit 1
          }
          test "$installed_moonc" = "$MOONC_VERSION" || {
            echo "expected moonc $MOONC_VERSION, got $installed_moonc" >&2
            exit 1
          }
          test "$installed_node" = "$NODE_VERSION" || {
            echo "expected Node $NODE_VERSION, got $installed_node" >&2
            exit 1
          }
          moon update
          moon check --deny-warn --target js
          # `moon update` refreshes the registry index but does not install
          # dependencies that are reachable only from test builds. Prime that
          # exact graph once before the frozen release checks below.
          moon test --deny-warn --target native --build-only

      - name: Format, interfaces, and all-target checks
        run: |
          moon info --frozen
          moon fmt --check
          moon check --frozen --deny-warn --target native
          moon check --frozen --deny-warn --target wasm
          moon check --frozen --deny-warn --target wasm-gc
          moon check --frozen --deny-warn --target js
          git diff --check

      - name: All-target tests
        run: |
          moon test --frozen --deny-warn --target native
          moon test --frozen --deny-warn --target wasm
          moon test --frozen --deny-warn --target wasm-gc
          moon test --frozen --deny-warn --target js

      - name: Coverage thresholds
        run: node scripts/check-coverage.mjs

      - name: Public API documentation
        run: node scripts/check-api-docs.mjs

      - name: MF2 profile contract
        run: |
          node scripts/check-mf2-profile.mjs
          node scripts/version-contract.mjs check

      - name: Performance budgets
        run: node scripts/check-benchmarks.mjs

      - name: Packaged consumer smoke
        run: |
          node scripts/package-smoke.mjs
          moon check --frozen --deny-warn --target js

      - name: Generated i18n artifacts
        run: |
          moon run --frozen --target wasm cmd/i18n -- check \
            examples/rabbita_todo/localization/config.json \
            examples/rabbita_todo/localization/schema.json \
            examples/rabbita_todo/localization/locales \
            examples/rabbita_todo/i18n \
            examples/rabbita_todo/public/i18n

      - name: Application authoring stays runtime-free
        run: |
          if grep -R -n -E '@runtime|MessageArg|translate_raw' \
            examples/rabbita_todo/main \
            examples/rabbita_todo/localization; then
            echo "maintained application source must use only its generated i18n package" >&2
            exit 1
          fi

      - name: Rabbita Todo release build
        run: |
          moon install moonbit-community/warren@0.2.2
          cd examples/rabbita_todo
          warren build --dist /tmp/moonbit-i18n-rabbita-todo
          node ../../scripts/check-web-size.mjs /tmp/moonbit-i18n-rabbita-todo
          if find /tmp/moonbit-i18n-rabbita-todo -name '*.lampclaw.lock' -print -quit | grep -q .; then
            echo "release artifact contains a generation coordination lock" >&2
            exit 1
          fi

      - name: Publish archive contents
        run: |
          # Moon 0.1.20260803 writes the package list to stderr.
          package_list="$(moon package --frozen --list 2>&1)"
          printf '%s\n' "$package_list"
          if printf '%s\n' "$package_list" | grep -E \
            '(^examples/|^scripts/|^benchmarks/|^tests/|^\.github/|^moon\.work$|^package(-lock)?\.json$|^playwright\.config\.mjs$|^AGENTS\.md$|^CONTRIBUTING\.md$|^docs/release-checklist\.md$|^docs/releases/|_test\.mbt$|_wbtest\.mbt$|pkg\.generated\.mbti$)'; then
            echo "publish archive contains development-only files" >&2
            exit 1
          fi
          printf '%s\n' "$package_list" | grep -q '^runtime/message.mbt$'
          printf '%s\n' "$package_list" | grep -q '^generator/generate.mbt$'
          printf '%s\n' "$package_list" | grep -q '^generator/interchange.mbt$'
          printf '%s\n' "$package_list" | grep -q '^cmd/i18n/main.mbt$'
          printf '%s\n' "$package_list" | grep -q '^docs/roadmap.mbt.md$'
          printf '%s\n' "$package_list" | grep -q '^docs/roadmap.zh-CN.mbt.md$'
          printf '%s\n' "$package_list" | grep -q '^docs/support-policy.mbt.md$'
          printf '%s\n' "$package_list" | grep -q '^docs/support-policy.zh-CN.mbt.md$'
          printf '%s\n' "$package_list" | grep -q '^docs/translation-lifecycle.mbt.md$'
          printf '%s\n' "$package_list" | grep -q '^docs/translation-lifecycle.zh-CN.mbt.md$'
          printf '%s\n' "$package_list" | grep -q '^docs/web-delivery.mbt.md$'
          printf '%s\n' "$package_list" | grep -q '^docs/web-delivery.zh-CN.mbt.md$'

      - name: Generated and interface drift
        run: |
          git diff --exit-code
          status_output="$(git status --porcelain=v1)"
          if [ -n "$status_output" ]; then
            printf '%s\n' "$status_output"
            exit 1
          fi

  browser:
    name: Browser contract · ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup MoonBit
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moonbit-install.sh
          printf '%s  %s\n' "$MOONBIT_INSTALLER_SHA256" /tmp/moonbit-install.sh | sha256sum -c -
          bash /tmp/moonbit-install.sh "$MOONBIT_TOOLCHAIN"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify generated application
        run: |
          version_output="$(moon version --all)"
          installed_moon="$(printf '%s\n' "$version_output" | awk '$1 == "moon" { print $2; exit }')"
          installed_moonc="$(printf '%s\n' "$version_output" | awk '$1 == "moonc" { sub(/^v/, "", $2); split($2, parts, "+"); print parts[1]; exit }')"
          test "$installed_moon" = "$MOON_VERSION"
          test "$installed_moonc" = "$MOONC_VERSION"
          test "$(node -p 'process.versions.node')" = "$NODE_VERSION"
          moon update
          moon run --target wasm cmd/i18n -- check \
            examples/rabbita_todo/localization/config.json \
            examples/rabbita_todo/localization/schema.json \
            examples/rabbita_todo/localization/locales \
            examples/rabbita_todo/i18n \
            examples/rabbita_todo/public/i18n
          moon check --deny-warn --target js examples/rabbita_todo

      - name: Install browser tooling
        run: |
          moon install moonbit-community/warren@0.2.2
          npm ci
          npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Browser acceptance scenarios
        run: npm run test:browser -- --project="${{ matrix.browser }}"

  portable-cli:
    name: Portable CLI · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup MoonBit on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moonbit-install.sh
          printf '%s  %s\n' "$MOONBIT_INSTALLER_SHA256" /tmp/moonbit-install.sh | shasum -a 256 -c -
          bash /tmp/moonbit-install.sh "$MOONBIT_TOOLCHAIN"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP\moonbit-install.ps1"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\moonbit-install.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MOONBIT_WINDOWS_INSTALLER_SHA256) {
            throw "MoonBit installer checksum mismatch: $actual"
          }
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_TOOLCHAIN
          & "$env:RUNNER_TEMP\moonbit-install.ps1"
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: bash
        run: |
          version_output="$(moon version --all)"
          printf '%s\n' "$version_output"
          installed_moon="$(printf '%s\n' "$version_output" | awk '$1 == "moon" { print $2; exit }')"
          installed_moonc="$(printf '%s\n' "$version_output" | awk '$1 == "moonc" { sub(/^v/, "", $2); split($2, parts, "+"); print parts[1]; exit }')"
          test "$installed_moon" = "$MOON_VERSION"
          test "$installed_moonc" = "$MOONC_VERSION"
          test "$(node -p 'process.versions.node')" = "$NODE_VERSION"
          moon update
          moon check --deny-warn --target wasm cmd/i18n
          # Install dependencies reachable only from the CLI white-box tests;
          # the contract step then proves the graph is complete with --frozen.
          moon test --deny-warn --target wasm --build-only cmd/i18n

      - name: Wasm CLI check
        shell: bash
        run: |
          moon check --frozen --deny-warn --target wasm cmd/i18n

      - name: Wasm CLI tests
        shell: bash
        run: |
          set +e
          test_output="$(moon test --frozen --deny-warn --target wasm cmd/i18n 2>&1)"
          test_status=$?
          set -e
          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            summary="$(printf '%s\n' "$test_output" | tail -n 20)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            printf '::error file=cmd/i18n/main_wbtest.mbt,title=Wasm CLI tests failed::%s\n' "$summary"
            exit "$test_status"
          fi

      - name: Wasm CLI version
        shell: bash
        run: |
          package_version="$(node scripts/version-contract.mjs get)"
          test "$(moon run --frozen --target wasm cmd/i18n -- --version)" = "moon-i18n $package_version"

      - name: Native CLI contract
        shell: bash
        run: |
          moon check --frozen --deny-warn --target native cmd/i18n
          moon test --frozen --deny-warn --target native cmd/i18n
          package_version="$(node scripts/version-contract.mjs get)"
          test "$(moon run --frozen --target native cmd/i18n -- --version)" = "moon-i18n $package_version"

      - name: Installed CLI launcher
        shell: bash
        run: |
          install_dir="$(mktemp -d)"
          package_version="$(node scripts/version-contract.mjs get)"
          MOON_WORK=off moon tool build-binary-dep cmd/i18n --install-path "$install_dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            test "$(pwsh -File "$install_dir/moon-i18n.ps1" --version)" = "moon-i18n $package_version"
          else
            test "$("$install_dir/moon-i18n" --version)" = "moon-i18n $package_version"
          fi
